<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>what survives?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1f4a36;
    --forest-deep: #12301f;
    --forest-mid: #2b5e46;
    --mustard: #d9a441;
    --redorange: #c8542b;
    --cream: #f6eedc;
    --cream-dim: #cfc7ae;
    --gold-rule: rgba(217, 164, 65, 0.55);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --telugu: "Noto Sans Telugu", "Nirmala UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--forest-deep); color: var(--cream); }
  body { font-family: var(--serif); font-size: 18px; line-height: 1.55; min-height: 100vh; }
  [lang="te"] { font-family: var(--telugu); }
  a { color: var(--mustard); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 3px; }
  main:focus { outline: none; }
  .mono { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-dim); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- top strip + nav ---------- */
  .strip {
    display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; justify-content: space-between;
    padding: 0.6rem 1.25rem; background: var(--forest-deep); border-bottom: 1px solid var(--gold-rule);
  }
  .lang-switch { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; }
  .lang-switch button {
    font: inherit; font-family: var(--mono); font-size: 0.78rem; background: none; color: var(--cream-dim);
    border: 1px solid transparent; padding: 0.2rem 0.5rem; cursor: pointer; border-radius: 2px;
  }
  .lang-switch button[aria-pressed="true"] { color: var(--forest-deep); background: var(--mustard); }
  .lang-switch .label { margin-right: 0.5rem; }
  header.site {
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: baseline; justify-content: space-between;
    padding: 1rem 1.25rem; background: var(--forest);
  }
  .site-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 500; color: var(--cream); text-decoration: none; }
  .site-title .survives { color: var(--mustard); }
  nav.main ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; margin: 0; padding: 0; }
  nav.main a { color: var(--cream); text-decoration: none; font-family: var(--mono); font-size: 0.8rem; }
  nav.main a[aria-current="page"] { color: var(--mustard); border-bottom: 1px solid var(--mustard); }
  .circle-toggle {
    font: inherit; font-family: var(--mono); font-size: 0.78rem; background: none; color: var(--cream);
    border: 1px solid var(--gold-rule); border-radius: 999px; padding: 0.25rem 0.75rem; cursor: pointer;
  }
  .circle-menu { display: none; padding: 1rem 1.25rem; background: var(--forest-mid); border-bottom: 1px solid var(--gold-rule); }
  .circle-menu.open { display: block; }
  .circle-menu ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; }
  .circle-menu a { color: var(--cream); font-size: 0.95rem; }

  main { max-width: 980px; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 300; line-height: 1.15; margin: 0 0 0.6rem; }
  h1 { font-size: clamp(2.2rem, 6vw, 4rem); }
  h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); }
  h3 { font-size: 1.3rem; font-weight: 500; }
  p { margin: 0 0 1rem; max-width: 66ch; }
  .sub { color: var(--mustard); font-style: italic; }
  .small { font-size: 0.9rem; color: var(--cream-dim); }

  /* ---------- landing ---------- */
  .landing { padding-top: 1rem; }
  .landing .big-word { position: relative; margin: 2rem 0 1rem; min-height: 280px; display: grid; place-items: center; }
  .mustard-shape {
    position: absolute; inset: 0; margin: auto; width: min(560px, 100%); height: 260px;
    background: var(--mustard); border-radius: 58% 42% 49% 51% / 52% 60% 40% 48%; opacity: 0.94; transform: rotate(-3deg);
  }
  .landing .big-word .word {
    position: relative; font-size: clamp(3.4rem, 10vw, 6.5rem); color: var(--forest-deep); font-weight: 500;
    z-index: 1; text-align: center; padding: 0 1rem;
  }
  .landing .big-word .word[lang="te"] { font-size: clamp(2.8rem, 8vw, 5rem); }
  .meta-line { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; align-items: center; margin-top: 0.8rem; }
  .play {
    font: inherit; font-family: var(--mono); font-size: 0.9rem; background: var(--mustard); color: var(--forest-deep);
    border: 0; padding: 0.6rem 1.1rem; cursor: pointer; border-radius: 2px;
  }
  .play[disabled] { opacity: 0.55; cursor: default; }
  .reveal-english { min-height: 2.5rem; margin-top: 1.25rem; color: var(--cream); font-size: 1.25rem; }
  .reveal-english.hidden { visibility: hidden; }
  .pending-note { color: var(--cream-dim); font-family: var(--mono); font-size: 0.8rem; }
  .blurb { margin-top: 2rem; font-size: 1.05rem; }
  .enter { display: inline-block; margin-top: 1.25rem; font-family: var(--mono); font-size: 0.9rem; }

  /* ---------- index: non-overlapping floating words ---------- */
  .index-head { margin-bottom: 1.25rem; }
  .float-field { position: relative; width: 100%; height: 560px; }
  .float-word {
    position: absolute; top: 0; left: 0; white-space: nowrap; color: var(--cream); text-decoration: none;
    font-family: var(--serif); font-size: clamp(1.1rem, 2.6vw, 1.7rem); line-height: 1.2;
    transition: color 0.2s ease;
  }
  .float-word.proverb { font-size: clamp(0.95rem, 2vw, 1.25rem); font-style: italic; }
  .float-word:hover, .float-word:focus-visible { color: var(--mustard); }
  .float-word .eng {
    display: none; position: absolute; left: 0; top: 100%; margin-top: 2px; font-size: 0.78rem; font-family: var(--mono);
    color: var(--cream); background: var(--forest-deep); border: 1px solid var(--gold-rule); padding: 0.1rem 0.4rem; white-space: nowrap; z-index: 5;
  }
  .float-word:hover .eng, .float-word:focus-visible .eng { display: block; }
  .room-label { position: absolute; font-family: var(--mono); font-size: 0.72rem; color: var(--cream-dim); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .list-view { display: none; }
  .list-view.show { display: block; }
  .list-view ol { padding-left: 1.4rem; }
  .list-view li { margin-bottom: 0.4rem; }
  .list-view-toggle { margin-bottom: 1rem; font: inherit; font-family: var(--mono); font-size: 0.8rem; background: none; color: var(--mustard); border: 1px solid var(--gold-rule); padding: 0.3rem 0.7rem; cursor: pointer; }

  /* ---------- term & proverb pages ---------- */
  .term-head { margin-bottom: 1.5rem; }
  .term-head .form-big { font-family: var(--serif); font-size: clamp(2.4rem, 7vw, 4.2rem); font-weight: 300; margin: 0.2rem 0; }
  .term-head .form-big[lang="te"] { font-family: var(--telugu); font-size: clamp(2.1rem, 6vw, 3.6rem); }
  .section { display: grid; grid-template-columns: 180px 1fr; gap: 0.5rem 1.5rem; padding: 1.4rem 0; border-top: 1px solid var(--gold-rule); }
  .section .label { font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mustard); padding-top: 0.25rem; }
  .section .body { min-width: 0; }
  @media (max-width: 680px) { .section { grid-template-columns: 1fr; } }
  .transcript { font-family: var(--mono); font-size: 0.95rem; color: var(--cream); margin: 0.5rem 0; }
  .tone-legend { font-family: var(--mono); font-size: 0.8rem; color: var(--cream-dim); }
  .side-by-side { display: grid; gap: 0.6rem; }
  .side-by-side .line { margin: 0; }
  .side-by-side .script { font-size: 1.2rem; }
  .side-by-side .gloss { color: var(--cream-dim); font-size: 0.95rem; }
  .rendering-box { margin: 0.5rem 0; padding: 1.2rem; min-height: 120px; border: 1px dashed var(--gold-rule); color: var(--cream-dim); font-size: 0.95rem; display: grid; gap: 0.7rem; align-content: start; }
  .swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .swatch { width: 64px; height: 44px; border-radius: 2px; display: grid; place-items: end start; padding: 0.2rem; font-family: var(--mono); font-size: 0.65rem; color: var(--forest-deep); }
  .three-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  @media (max-width: 720px) { .three-cols { grid-template-columns: 1fr; } }
  .three-cols .col { border-left: 1px solid var(--gold-rule); padding-left: 0.8rem; }
  .scale-mark { display: inline-block; font-family: var(--mono); font-size: 0.85rem; padding: 0.2rem 0.5rem; border: 1px solid var(--gold-rule); color: var(--cream); text-decoration: none; }
  .zone-kept { background: rgba(120, 190, 130, 0.2); }
  .zone-flattened { background: rgba(217, 164, 65, 0.22); }
  .zone-lost { background: rgba(200, 84, 43, 0.25); }
  .next-prev { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; font-family: var(--mono); font-size: 0.85rem; flex-wrap: wrap; }
  .widest-gap { color: var(--cream); }
  .social-panel { border-left: 2px solid var(--redorange); padding-left: 0.9rem; color: var(--cream-dim); }
  audio { width: 100%; max-width: 420px; margin: 0.3rem 0; }

  /* outside works */
  ul.works { list-style: none; padding: 0; margin: 0; display: grid; gap: 1.6rem; }
  ul.works li { border-left: 2px solid var(--mustard); padding-left: 1rem; }
  .work-kind { margin-bottom: 0.2rem; }
  .work-title { margin: 0 0 0.3rem; font-size: 1.05rem; }
  .work-why { color: var(--cream-dim); font-size: 0.95rem; margin-bottom: 0.6rem; }
  .work-fig { margin: 0.5rem 0; max-width: 520px; }
  .work-fig img { display: block; width: 100%; height: auto; max-height: 440px; object-fit: contain; background: var(--cream); padding: 0.4rem; }
  .work-fig figcaption { margin-top: 0.4rem; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 640px; margin: 0.5rem 0; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ---------- scale ---------- */
  .scale-wash { border-radius: 4px; padding: 1.4rem; margin: 1.2rem 0; }
  .scale-wash.zone-kept { background: rgba(120, 190, 130, 0.2); }
  .scale-wash.zone-flattened { background: rgba(217, 164, 65, 0.22); }
  .scale-wash.zone-lost { background: rgba(200, 84, 43, 0.25); }
  .scale-wash h3 { margin-bottom: 0.3rem; }
  .scale-words { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
  .scale-words a { color: var(--cream); font-family: var(--mono); font-size: 0.85rem; text-decoration: none; border-bottom: 1px solid var(--gold-rule); }
  table.plain { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  table.plain th, table.plain td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--gold-rule); vertical-align: top; font-size: 0.95rem; }
  table.plain th { font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; color: var(--mustard); font-weight: 400; }

  /* ---------- references / about ---------- */
  .quote { font-size: 1.5rem; font-style: italic; border-left: 3px solid var(--mustard); padding-left: 1rem; margin: 1.5rem 0; color: var(--cream); }
  ul.refs { padding-left: 1.2rem; }
  ul.refs li { margin-bottom: 0.7rem; }
  .palette-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.6rem 0 1rem; }
  .palette-row div { padding: 0.8rem 1rem; min-width: 150px; font-family: var(--mono); font-size: 0.8rem; color: var(--forest-deep); }
  h2.sub-h { margin-top: 2rem; font-size: 1.4rem; }

  footer.site-foot { border-top: 1px solid var(--gold-rule); padding: 1.2rem; text-align: center; font-family: var(--mono); font-size: 0.75rem; color: var(--cream-dim); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="strip">
  <div class="lang-switch" role="group" aria-label="Interface language">
    <span class="label mono" id="lang-label">LANGUAGE</span>
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="yo" aria-pressed="false" lang="yo">Yorùbá</button>
    <button type="button" data-lang="te" aria-pressed="false" lang="te">తెలుగు</button>

</div>

</div>

<header class="site">

  <nav class="main" aria-label="Main">
    <ul>

</header>

<main id="app" tabindex="-1"></main>

<footer class="site-foot">what survives? · a digital hub, not a dictionary</footer>

<script>
/* =========================================================
   INTERFACE STRINGS
   Yorùbá and Telugu entries are drafts from the project plan.
   Any string without a translation falls back to English and
   is marked lang="en".
   ========================================================= */
const UI = {
  en: {

    noEmbed: "No media embedded yet.",
    proverbLiteral: "Literal translation", proverbIntended: "Intended meaning",
    socialHdr: "Social knowledge", widestGap: "Widest gap",

  yo: {
    index: "àtòjọ", scale: "ìwọ̀n", references: "àwọn orísun", about: "nípa iṣẹ́ yìí",
    listen: "Gbọ́ kọ́kọ́. Ìtumọ̀ ń bọ̀ lẹ́yìn.",

  te: {

const SPEAKERS = {

};

/* Telugu dictionary cited for Telugu glosses. */
const BROWN = {
  t: "Brown, C. P. (1852; reprint 1979). Dictionary, Telugu–English [Nighaṇṭu, Telugu Iṅglīṣ]. New Delhi: Asian Educational Services.",
  href: "https://openlibrary.org/books/OL4245461M"
};

/* =========================================================
   CONTENT BANK
   Audio files are expected at audio/<id>.mp3 and are added later.
   Until a file exists the page shows "recording pending".
   ========================================================= */
const TERMS = [
  {
    id: "y1", lang: "yo", room: "body", form: "gbìm / kìm", forms: "gbìm and kìm, back to back, both Low tone",
    english: "“thud” (gbìm), “flutter” (kìm)",
    englishNote: "Lotven says both “describe degrees of heart palpitation,” with the former associated with a heavier heartbeat.",

    loss: "The link between the two heartbeats is gone.",
    nonverbal: {

    },
    judgeLabels: ["thud / flutter", "the artistic palette"],
    scale: "flattened",
    tests: { translation: "partial", form: "partial" },
    sources: [

      "Dingemanse 2018, p. 8",
      "Speaker: " + SPEAKERS.yo + " (Yorùbá), interpretation confirmed"
    ],
    existing: [
      { kind: "Film score", work: "John Williams, “Main Title” from Jaws (1975)",
        why: "A slow, low two-note pulse that listeners hear as a heartbeat. Chosen as the heavy gbìm, where weight does the work.",

    ]
  },
  {
    id: "t1", lang: "te", room: "body", form: "ధకధక / dhaka-dhaka", forms: "dhakadhaka, with transcript",
    english: "“pounding”",
    englishNote: "",
    omits: "The doubled, drumming rhythm and the sense of fear or anticipation. “Pounding” gives the event but not the rhythm in the word.",
    prompt: "When would you say this? Is it fear, excitement, or both?",
    sideBySide: [
      { script: "నా గుండె ధకధక లాడింది", gloss: "nā guṇḍe dhakadhaka lāḍindi, shared with Y1" }
    ],
    loss: "Small. This is my best candidate for “kept.”",
    nonverbal: { text: "A recorded pulse, with a notation of the rhythm.", swatches: [] },
    judgeLabels: ["“pounding”", "the pulse recording"],
    scale: "kept",
    tests: { translation: "pass", form: "pass" },
    sources: ["Speaker: " + SPEAKERS.te + " (Telugu), interpretation confirmed", BROWN, "Duggirala (2024)"],
    existing: [

    ],

  },
  {
    id: "y2", lang: "yo", room: "water", form: "táló / tàlǒ", forms: "táló and tàlǒ",

/* =========================================================
   HELPERS
   ========================================================= */
let currentLang = "en";
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
};

function t(key) {
  const pick = (dict) => {
    let v = dict;
    for (const p of key.split(".")) { if (v == null) return undefined; v = v[p]; }
    return v;
  };
  const v = currentLang !== "en" ? pick(UI[currentLang]) : undefined;
  if (v !== undefined) return { text: v, lang: currentLang };
  return { text: pick(UI.en), lang: "en" };
}
function tt(key) { return t(key).text; }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function roomName(key) { return UI.en.rooms[key] || key; }
function findTerm(id) { return TERMS.find(x => x.id === id); }
function findProverb(id) { return PROVERBS.find(x => x.id === id); }
function isTelugu(s) { return /[ఀ-౿]/.test(s); }
function citeHtml(c) {
  return typeof c === "string" ? esc(c) : `${esc(c.t)} <a href="${esc(c.href)}" rel="noopener">record ↗</a>`;
}

/* =========================================================
   AUDIO
   ========================================================= */
function audioBlock(id, label) {
  return `
    <div class="audio-wrap" data-audio="${esc(id)}">
      <audio controls preload="none" src="audio/${esc(id)}.mp3" aria-label="${esc(label)}"></audio>
      <div class="pending-note" data-audio-status>${esc(tt("pending"))}</div>
    </div>`;
}

function wireAudio(root, onEnded) {
  root.querySelectorAll(".audio-wrap audio").forEach(a => {
    const status = a.closest(".audio-wrap").querySelector("[data-audio-status]");
    a.addEventListener("error", () => { if (status) status.hidden = false; });
    a.addEventListener("loadeddata", () => { if (status) status.hidden = true; });
    if (onEnded) a.addEventListener("ended", onEnded);
  });
}

function indexWords() {

    .concat(PROVERBS.map(p => ({ ...p, href: `#/proverb/${p.id}`, english: p.intended, room: "sayings", kind: "proverb" })));

function renderIndex() {

    <span class="small" lang="en">· ${esc(w.english)} · ${esc(roomName(w.room))}</span></li>`).join("");

      <div class="float-field" id="float-view"></div>
      <div class="list-view" id="list-view"><ol>${listItems}</ol></div>
    </section>`;
}

function findSpot(cx, cy, w, h, W, placed) {
  const maxR = 2000;
  for (let r = 0; r <= maxR; r += 8) {
    const steps = Math.max(8, Math.round((2 * Math.PI * r) / 24));
    for (let k = 0; k < steps; k++) {
      const a = (k / steps) * Math.PI * 2;
      const x = Math.round(cx + r * Math.cos(a) - w / 2);
      const y = Math.round(cy + r * Math.sin(a) * 0.75 - h / 2);
      if (x < 4 || x + w > W - 4 || y < 4) continue;
      const hit = placed.some(p => x < p.r && x + w > p.l && y < p.b && y + h > p.t);
      if (!hit) return { x, y };
    }
  }
  return null;
}

function layoutIndex() {
  const field = document.getElementById("float-view");
  if (!field || field.offsetParent === null) return;
  const W = field.clientWidth;
  if (!W) return;
  const H0 = Math.max(520, Math.round(W * 0.7));
  field.innerHTML = "";

  const all = indexWords();
  const byRoom = {};
  all.forEach(w => { (byRoom[w.room] = byRoom[w.room] || []).push(w); });

  const queue = [];
  ROOMS.forEach(r => {
    const lab = document.createElement("div");
    lab.className = "room-label";
    lab.textContent = tt("rooms." + r.key);
    field.appendChild(lab);
    queue.push({ el: lab, room: r, isLabel: true });
    (byRoom[r.key] || []).forEach(w => {
      const a = document.createElement("a");
      a.className = "float-word" + (w.kind === "proverb" ? " proverb" : "");
      a.href = w.href;
      a.lang = w.lang;
      a.innerHTML = `${esc(w.short || w.form)}<span class="eng" lang="en">${esc(w.english)}${w.scale ? " · " + esc(tt("zones." + w.scale)) : ""}</span>`;
      field.appendChild(a);
      queue.push({ el: a, room: r, isLabel: false });
    });
  });

  // Labels go first so words avoid them.
  queue.sort((p, q) => (p.isLabel === q.isLabel ? 0 : p.isLabel ? -1 : 1));
  const placed = [];
  let maxBottom = 0;
  queue.forEach(q => {
    const w = q.el.offsetWidth, h = q.el.offsetHeight;
    const spot = findSpot(q.room.x * W, q.room.y * H0, w, h, W, placed) || { x: 4, y: maxBottom + 16 };
    q.el.style.left = spot.x + "px";
    q.el.style.top = spot.y + "px";
    placed.push({ l: spot.x - 8, t: spot.y - 6, r: spot.x + w + 8, b: spot.y + h + 6 });
    maxBottom = Math.max(maxBottom, spot.y + h);
  });
  field.style.height = (maxBottom + 40) + "px";
}

function bindIndex() {
  const btn = document.getElementById("list-toggle");
  const fv = document.getElementById("float-view");
  const lv = document.getElementById("list-view");
  if (!btn) return;
  layoutIndex();
  btn.addEventListener("click", () => {
    const showList = !lv.classList.contains("show");
    lv.classList.toggle("show", showList);
    fv.style.display = showList ? "none" : "";
    btn.setAttribute("aria-pressed", String(showList));
    btn.textContent = showList ? tt("floatView") : tt("listView");
    if (!showList) layoutIndex();
  });
}

let layoutTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => {
    if (location.hash.replace(/^#\/?/, "") === "index") layoutIndex();
  }, 150);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (location.hash.replace(/^#\/?/, "") === "index") layoutIndex();
  });
}

function renderAbout() {
  return `
    <section>
      <h1>${esc(tt("about"))}</h1>
      <p class="quote" lang="en">${esc(tt("aboutQuote"))}</p>
      <p class="small" lang="en">Westermann, quoted in Dingemanse (2018, p. 7).</p>
      <h2 class="sub-h">Statement</h2>
      <p>When you translate a word like Yorùbá káló or Telugu గలగల into English, a dictionary falls short of being able to describe a certain sentiment to native speakers. Dingemanse (2015) calls the difference description versus depiction. Ideophones are “more like poetic performances than prosaic descriptions” (p. 947).</p>
      <p>So this site makes you hear before you read. Each word arrives as sound, then as its English equivalent, then as what that equivalent leaves out, in a speaker’s own words and in a piece of music, art or film that tries to carry some of it back.</p>
      <p>Translation costs something, and the cost can be measured if you ask the right person. The English side of a dictionary entry is a decision, not a fact, and the people who can audit it are the ones who speak the language.</p>
      <h2 class="sub-h">The readings and what each did</h2>
      <ul class="refs">
        <li><strong>Dingemanse (2015).</strong> The description/depiction split, and the idea that framing cues tell a listener which mode they are in. That is why every word plays before it is explained. The Nuckolls line on “cinematic renderings” (p. 952) gave me the idea to use film and movement.</li>
        <li><strong>Dingemanse (2018).</strong> The history of the loss this project describes: Vidal’s 1852 observation about a separate adverb in each case (p. 5), Westermann’s “you have to see it” (p. 7), and the “pragmatic equivalence” warning (p. 19). It also gave me Westermann’s sound table, which I test openly.</li>
        <li><strong>Lotven &amp; Ajibade (2024).</strong> The source of every Yorùbá form, tone mark and gloss. Its claim that ideophones behave “very much like other words” (p. 53).</li>
        <li><strong>Salami (2004).</strong> The tone-less proverb that gave me Òwe lẹ́ṣin ọ̀rọ̀. Its warning about reading modern meanings into proverbs (p. 326) is why the “social knowledge” panel exists.</li>
        <li><strong>Yede, Akanmu &amp; Mayadenu.</strong> The Yorùbá proverbs with tone marks. Yankah’s emphasis on context (p. 97) shaped the proverb template.</li>
        <li><strong>Bernard &amp; Fernandez (2012).</strong> Richmond’s model gave me the “kept” end of the scale, and the authors’ caution about stereotypes (p. 330) shaped how each non-verbal piece is labeled.</li>
        <li><strong>Chebanne (2023), Hossain (2026), Roy-Campbell (2003), Beyer (2020), Kutsch Lojenga (2018), Duggirala (2024), Bodomo (2006).</strong> Chebanne on how sound words are classed; Hossain on how standardization erases; Roy-Campbell on language carrying knowledge; Beyer and Kutsch Lojenga on iconicity and tone; Duggirala on Telugu iconicity; Bodomo, a native-speaker linguist of Dagaare named in Dingemanse (p. 17).</li>
      </ul>
      <h2 class="sub-h">Colors</h2>
      <p>Yede et al. quote Achebe’s image of palm oil with which words are eaten (p. 94). The palette takes that image as its logic: the colors are food that carries meaning.</p>
      <div class="palette-row">
        <div style="background:#1f4a36;color:#f6eedc">forest green · the ground, and the leaf a meal is served on</div>
        <div style="background:#d9a441">mustard · turmeric; marks the spoken word and the audio</div>
        <div style="background:#c8542b;color:#f6eedc">red-orange · palm oil and chili; marks what the English leaves out</div>
        <div style="background:#f6eedc">cream · the page; the English gloss, the written side</div>
      </div>
      <h2 class="sub-h">Method and credits</h2>
      <p>Speakers: <strong>Ayomade Adeolu-Akande</strong> (Yorùbá) and <strong>Deepthi Medikondla</strong> (Telugu). Both confirmed the interpretations on their entries. The recordings, transcripts and non-verbal pieces are by the author. Each non-verbal piece is labeled “my attempt” and was reviewed by a native speaker.</p>
      <p>Every Yorùbá and Telugu word, proverb and transcript is in its own script. Interface labels in Yorùbá and Telugu are drafts and should be checked by a native speaker.</p>
      <p class="small">Limits, stated publicly: the scale is mine, not a standard. Westermann’s mappings are hypotheses. Speakers are individuals, not whole languages. The English definitions are my attempts.</p>
    </section>`;
}

function renderNotFound() {
  return `<section><h1>not found</h1><p><a href="#/index">${esc(tt("backIndex"))}</a></p></section>`;
}

/* =========================================================
   ROUTER + CHROME
   ========================================================= */
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [a, b] = hash.split("/");
  let html = "";
  let navKey = "";
  if (!a) { html = renderLanding(); }
  else if (a === "index") { html = renderIndex(); navKey = "index"; }
  else if (a === "term") { html = renderTerm(b); navKey = "index"; }
  else if (a === "proverb") { html = renderProverb(b); navKey = "index"; }
  else if (a === "scale") { html = renderScale(); navKey = "scale"; }
  else if (a === "references") { html = renderReferences(); navKey = "references"; }
  else if (a === "about") { html = renderAbout(); navKey = "about"; }
  else { html = renderNotFound(); }

  const app = document.getElementById("app");
  app.innerHTML = html;
  if (!a) bindLanding();
  else if (a === "index") bindIndex();
  else if (a === "term") wireAudio(app);
  else if (a === "proverb") wireAudio(app);
  document.querySelectorAll("nav.main a[data-nav]").forEach(el => {
    if (el.dataset.nav === navKey) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  });
  app.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "auto" });
}

function applyChrome() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll(".lang-switch button[data-lang]").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === currentLang));
  });
  document.querySelectorAll("nav.main a[data-nav]").forEach(a => { a.textContent = tt(a.dataset.nav); });
  document.getElementById("circle-toggle").textContent = currentLang === "en" ? "all words" : (currentLang === "yo" ? "gbogbo ọ̀rọ̀" : "అన్ని పదాలు");
  document.getElementById("lang-label").textContent = currentLang === "en" ? "LANGUAGE" : (currentLang === "yo" ? "ÈDÈ" : "భాష");
  renderCircleMenu();
}

function renderCircleMenu() {
  const items = TERMS.map(x => `<li><a href="#/term/${x.id}" lang="${esc(x.lang)}">${esc(x.form)}</a></li>`).join("")
    + PROVERBS.map(x => `<li><a href="#/proverb/${x.id}" lang="${esc(x.lang)}">${esc(x.short)}</a></li>`).join("");
  document.getElementById("circle-list").innerHTML = items;
}

document.querySelectorAll(".lang-switch button[data-lang]").forEach(b => {
  b.addEventListener("click", () => {
    currentLang = b.dataset.lang;
    storage.set("what-survives-lang", currentLang);
    applyChrome();
    route();
  });
});

const toggle = document.getElementById("circle-toggle");
toggle.addEventListener("click", () => {
  const menu = document.getElementById("circle-menu");
  const open = !menu.classList.contains("open");
  menu.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", String(open));
});

window.addEventListener("hashchange", route);

currentLang = storage.get("what-survives-lang") || "en";
applyChrome();
route();
</script>
</body>
</html>
